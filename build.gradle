plugins {
    id 'java-library'
    id 'idea'
    alias libs.plugins.modDevGradle
}

version = "${mod_version}"
group = 'org.tdddd'
base.archivesName = "${mod_id}"

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
}

sourceSets.main.resources {
    srcDirs 'src/main/resources', 'src/generated/resources'
    exclude 'META-INF/mods.toml.1.20.1'
}

repositories {
    mavenLocal()
    maven { url = 'file:///G:/PCL/libraries' }   // launcher-provided runtime libraries (Maven layout)
    mavenCentral()
    maven { url = 'https://maven.neoforged.net/releases' }
    maven { url = 'https://maven.blamejared.com' }
    maven { url = 'https://www.cursemaven.com' }
    maven { url = 'https://dl.cloudsmith.io/public/geckolib3/geckolib/maven/' }
}

neoForge {
    version = libs.versions.neoForge.get()

    runs {
        client {
            client()
            systemProperty 'neoforge.enabledGameTestNamespaces', mod_id
        }
        server {
            server()
            programArgument '--nogui'
        }
        data {
            serverData()
            clientData()
            programArguments.addAll '--mod', mod_id, '--all',
                    '--output', file('src/generated/resources/').getAbsolutePath(),
                    '--existing', file('src/main/resources/').getAbsolutePath()
        }
        configureEach {
            systemProperty 'forge.logging.markers', 'REGISTRIES'
            logLevel = org.slf4j.event.Level.INFO
        }
    }

    mods {
        "${mod_id}" {
            sourceSet(sourceSets.main)
        }
    }
}

configurations {
    runtimeClasspath.extendsFrom localRuntime
}

dependencies {
    // TODO(26.1.2 port): add third-party dependencies here (JEI / GeckoLib 5 / LDLib ...)
}

var generateModMetadata = tasks.register("generateModMetadata", ProcessResources) {
    var replaceProperties = [
            minecraft_version      : minecraft_version,
            minecraft_version_range: minecraft_version_range,
            neo_version            : neo_version,
            neo_version_range      : neo_version_range,
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_license            : mod_license,
            mod_version            : mod_version,
            mod_authors            : mod_authors,
            mod_description        : mod_description,
    ]
    inputs.properties replaceProperties
    expand replaceProperties
    from "src/main/templates"
    into "build/generated/sources/modMetadata"
}
sourceSets.main.resources.srcDir generateModMetadata
neoForge.ideSyncTask generateModMetadata

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}
tasks.named('processResources').configure {
    // main/resources and generated/resources may contain the same file; keep the first
    duplicatesStrategy = 'EXCLUDE'
}

// 作为 jar-in-jar 被 epca 内置时需要显式模块名（ModDevGradle 的 jarJar 要求，
// 以避免不同模组的库文件重名冲突）。
tasks.named('jar', Jar).configure {
    manifest {
        attributes('Automatic-Module-Name': 'org.tddd.yawning_neko_api')
    }
}