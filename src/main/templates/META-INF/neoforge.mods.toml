modLoader = "javafml"
loaderVersion = "[3,)"
minecraftVersion = "${minecraft_version}"
neoVersion = "${neo_version}"
license = "${mod_license}"

[[mods]]
modId = "${mod_id}"
version = "${mod_version}"
displayName = "${mod_name}"
authors = "${mod_authors}"
description = '''${mod_description}'''

# NeoForge 26.1.2 reads Mixin configs from the [[mixins]] block of
# neoforge.mods.toml (same place as NeoForge's own META-INF/neoforge.mods.toml).
# The old jar-manifest MixinConfigs attribute is no longer used.
[[mixins]]
config = "yawning_neko_api.mixins.json"